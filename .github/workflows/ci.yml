name: ci

on:
  push:
    branches: [main]
  pull_request:

# The `check` job is the socle's reusable CI (maelys-release check-product.yml
# at the version release.yml pins): `make check` on the three release targets,
# sanitizers on Linux x86_64 and the socle drift check. adopt keeps the socle
# line current. The jobs below it are this product's own.
jobs:
  check:
    uses: maelys-dev/maelys-release/.github/workflows/check-product.yml@ed835783c55518e5ce8439828b9e09c2d388d489 # untagged
    with:
      product: maelys-json
      fuzz_command: make fuzz-smoke FUZZ_CC=clang FUZZ_TIME=30

  check-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            cc: clang
            cxx: clang++
          - os: macos-latest
            cc: cc
            cxx: c++
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - run: make check

  cmake:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Debug -DMAELYS_JSON_WERROR=ON
      - run: cmake --build build-cmake
      - run: ctest --test-dir build-cmake --output-on-failure
      - run: make cmake-check

  jcs-differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make jcs-diff JCS_COUNT=2000

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y clang-tidy
      - run: make tidy
