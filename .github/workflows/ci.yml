name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            cc: clang
            cxx: clang++
          - os: macos-latest
            cc: cc
            cxx: c++
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - run: make check
      - run: make asan
      - name: Release socle drift
        if: matrix.os == 'ubuntu-latest' && matrix.cc == 'clang'
        run: |
          set -euo pipefail
          sha="$(sed -n 's|.*maelys-release/.github/workflows/release.yml@\([0-9a-f]\{40\}\).*|\1|p' .github/workflows/release.yml)"
          test -n "$sha"
          git clone -q https://github.com/maelys-dev/maelys-release.git "$RUNNER_TEMP/maelys-release"
          git -C "$RUNNER_TEMP/maelys-release" checkout -q "$sha"
          "$RUNNER_TEMP/maelys-release/scripts/adopt.sh" . --product maelys-json --check
      - run: make ubsan

  cmake:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Debug -DMAELYS_JSON_WERROR=ON
      - run: cmake --build build-cmake
      - run: ctest --test-dir build-cmake --output-on-failure
      - run: make cmake-check

  fuzz:
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - run: make fuzz-smoke FUZZ_CC=clang FUZZ_TIME=30

  jcs-differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make jcs-diff JCS_COUNT=2000

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y clang-tidy
      - run: make tidy
