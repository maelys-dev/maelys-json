    if: needs.release.result == 'success'
    uses: maelys-dev/maelys-release/.github/workflows/tap.yml@bbe2c29c3ebca751f6ad3471fe0b31238ed1af64 # untagged
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: libmaelys-json
      tag: ${{ inputs.tag || github.ref_name }}
      bottles: '["macos-15","macos-26"]'
    secrets:
      tap_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      tap_signing_key: ${{ secrets.HOMEBREW_TAP_SIGNING_KEY }}
