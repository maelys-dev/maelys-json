name: release

# Managed by maelys-release v0.2.5 (0.2.5). Regenerate with
# scripts/adopt.sh of maelys-release; do not edit by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: maelys-dev/maelys-release/.github/workflows/release.yml@f13bf432e222c40673a0f0634bafbce11e3f772e # v0.2.5
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: maelys-json

  tap-libmaelys-json:
    needs: release
    uses: maelys-dev/maelys-release/.github/workflows/tap.yml@f13bf432e222c40673a0f0634bafbce11e3f772e # v0.2.5
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: libmaelys-json
      bottles: '["macos-15","macos-26"]'
    secrets:
      tap_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      tap_signing_key: ${{ secrets.HOMEBREW_TAP_SIGNING_KEY }}
