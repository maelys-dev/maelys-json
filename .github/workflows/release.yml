name: release

# Managed by maelys-release v0.44.0 (0.44.0). Regenerate with
# 'maelys-release adopt' of maelys-release; do not edit by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed tag whose release and Homebrew publication are replayed
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: maelys-dev/maelys-release/.github/workflows/release.yml@a57c25b4429f22af3dfd3edd0a72b2d0514be19f # v0.44.0
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: maelys-json
      tag: ${{ inputs.tag || github.ref_name }}

  tap-libmaelys-json:
    needs: release
    if: needs.release.result == 'success'
    uses: maelys-dev/maelys-release/.github/workflows/tap.yml@a57c25b4429f22af3dfd3edd0a72b2d0514be19f # v0.44.0
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: libmaelys-json
      tag: ${{ inputs.tag || github.ref_name }}
      bottles: '["macos-15","macos-26"]'
    secrets:
      tap_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      tap_signing_key: ${{ secrets.HOMEBREW_TAP_SIGNING_KEY }}
